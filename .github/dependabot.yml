# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      actions-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    groups:
      pip-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # Match the GitHub Actions node24 runtime in action.yaml.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
    groups:
      ESLint:
        patterns:
          - eslint
          - '@typescript-eslint/*'
          - '@eslint/*'
          - typescript-eslint
      rollup:
        patterns:
          - '@rollup/*'
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
