name: Validate Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            **/action.yaml
            **/action.yml
            **/action.schema.yaml
            **/action.schema.yml
            **/*.md
          sparse-checkout-cone-mode: false
      - uses: jessehouwing/actions-example-checker@v0.0.12
